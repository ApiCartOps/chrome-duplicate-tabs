name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm ci

      - name: Build Tailwind CSS
        run: |
          npm run build:css

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps firefox chromium

      - name: Run unit tests (Jest)
        env:
          CI: true
        run: |
          npm test

      - name: Run Playwright E2E tests (Chromium + Firefox)
        env:
          CI: true
        run: |
          # run the export-focused test first to surface download issues quickly
          npx playwright test tests/playwright/export.spec.js --project=chromium,firefox --reporter=list || true
          # then run the full Playwright suite
          npx playwright test --project=chromium,firefox --reporter=list

      - name: Upload dist CSS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-css
          path: dist/tailwind.css

  package-xpi:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Build Tailwind CSS
        run: |
          npm run build:css

      - name: Build XPI (Firefox)
        run: |
          npm run build:xpi

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpi-artifacts
          path: tests/playwright/.web-ext-artifacts/

      - name: Upload dist CSS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-css
          path: dist/tailwind.css

  e2e-edge:
    name: Playwright E2E (Edge)
    runs-on: windows-latest
    needs: test
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm ci

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps

      - name: Run Playwright E2E tests (Edge)
        env:
          CI: true
        run: |
          # run the export-focused test first to surface download issues quickly
          npx playwright test tests/playwright/export.spec.js --project=edge --reporter=list || true
          # then run the full Playwright suite for Edge
          npx playwright test --project=edge --reporter=list
