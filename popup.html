<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tab Manager</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="container">
      <header>
        <h1>📌 Smart Tab Manager</h1>
      </header>

      <div class="stats">
        <div class="stat-item">
          <span class="stat-label">Total Tabs:</span>
          <span class="stat-value" id="totalTabs">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Duplicate Tabs:</span>
          <span class="stat-value" id="duplicateTabs">0</span>
        </div>
      </div>

      <div class="actions">
        <button id="listAllTabs" class="btn btn-primary">✅ List All Tabs</button>
        <button id="closeDuplicateTabs" class="btn btn-danger">✅ Close Duplicate Tabs</button>
        <button id="groupTabsByDomain" class="btn btn-info">✅ Group Tabs by Domain</button>
        <button id="closeTabsExceptActive" class="btn btn-warning">✅ Close Tabs Except Active One</button>
      </div>

      <div id="tabsList" class="tabs-list"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
