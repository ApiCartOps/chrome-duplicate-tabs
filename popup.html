<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Duplicate Tabs Manager</title>
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #333;
    }
    
    .stats {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
    }
    
    .stat-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .stat-item:last-child {
      margin-bottom: 0;
    }
    
    .stat-label {
      color: #666;
      font-weight: 500;
    }
    
    .stat-value {
      color: #333;
      font-weight: bold;
    }
    
    .duplicate-list {
      max-height: 300px;
      overflow-y: auto;
    }
    
    .duplicate-item {
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 8px;
      background: white;
    }
    
    .duplicate-url {
      font-size: 12px;
      color: #666;
      word-break: break-all;
      margin-bottom: 8px;
    }
    
    .duplicate-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .duplicate-count {
      font-size: 14px;
      color: #ff5722;
      font-weight: bold;
    }
    
    .close-btn {
      background: #ff5722;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    
    .close-btn:hover {
      background: #e64a19;
    }
    
    .no-duplicates {
      text-align: center;
      padding: 20px;
      color: #4caf50;
      font-weight: 500;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #999;
    }
  </style>
</head>
<body>
  <h1>🔄 Duplicate Tabs Manager</h1>
  
  <div class="stats">
    <div class="stat-item">
      <span class="stat-label">Total Duplicates:</span>
      <span class="stat-value" id="totalDuplicates">-</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Unique URLs with Duplicates:</span>
      <span class="stat-value" id="uniqueUrls">-</span>
    </div>
  </div>
  
  <div id="content">
    <div class="loading">Loading...</div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
