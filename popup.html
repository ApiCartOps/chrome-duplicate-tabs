<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jwd-browser-tab-manager</title>
    <link rel="stylesheet" href="dist/tailwind.css">
  </head>
  <body>
    <div class="container bg-white rounded-lg p-2 flex flex-col md:flex-row gap-3 items-stretch max-w-[96vw] md:max-w-[900px] max-h-[640px] shadow-lg relative">
      <aside id="sideMenu" class="side-menu bg-gradient-to-b from-gray-100 to-white p-3 rounded-lg md:flex md:flex-col flex-row md:gap-2 gap-3 z-40 transition-all duration-300 md:w-auto w-full items-center md:items-start" role="navigation" aria-label="Actions">
        <div class="actions">
          <button id="listAllTabs" class="btn btn-primary flex items-center gap-3 justify-center w-11 h-11 md:w-full md:h-10" title="List all tabs" aria-label="List all tabs"><span class="btn-icon">📋</span><span class="btn-label">List All</span></button>
          <button id="listDuplicateTabs" class="btn btn-secondary flex items-center gap-3 justify-center w-11 h-11 md:w-full md:h-10" title="List duplicates" aria-label="List duplicates"><span class="btn-icon">🔎</span><span class="btn-label">Duplicates</span></button>
          <!-- removed quick-export from side menu to avoid duplicate controls -->
          <!-- export controls moved to header/stats to reduce duplication -->
          <button id="closeDuplicateTabs" class="btn btn-danger flex items-center gap-3 justify-center w-11 h-11 md:w-full md:h-10" title="Close duplicate tabs" aria-label="Close duplicate tabs"><span class="btn-icon">🗑️</span><span class="btn-label">Close Dups</span></button>
          <button id="groupTabsByDomain" class="btn btn-info flex items-center gap-3 justify-center w-11 h-11 md:w-full md:h-10" title="Group tabs by domain" aria-label="Group tabs by domain"><span class="btn-icon">🗂️</span><span class="btn-label">Group by Domain</span></button>
          <button id="closeTabsExceptActive" class="btn btn-warning flex items-center gap-3 justify-center w-11 h-11 md:w-full md:h-10" title="Close other tabs" aria-label="Close other tabs"><span class="btn-icon">❌</span><span class="btn-label">Close Others</span></button>
        </div>
        <div class="side-menu-footer">
          <button id="toggleSideMenu" class="btn btn-outline" title="Expand side menu" aria-label="Toggle side menu" aria-expanded="false">
            <span class="btn-icon">☰</span>
            <span class="btn-label">Menu</span>
          </button>
        </div>
      </aside>

      <!-- Overlay for small-screen side menu (hidden by default). Shown when hamburger toggled. -->
      <div id="sideMenuOverlay" class="hidden fixed inset-0 z-50 items-start justify-start">
        <div class="overlay-backdrop absolute inset-0 bg-black/50"></div>
        <nav class="overlay-panel relative bg-white w-full max-w-xs h-full p-4 overflow-y-auto shadow-lg">
          <button id="closeOverlayBtn" class="btn btn-outline mb-4" aria-label="Close menu">✖</button>
          <div class="overlay-items flex flex-col gap-3">
            <button id="overlayListAll" class="btn">List All</button>
            <button id="overlayListDuplicates" class="btn">Duplicates</button>
            <button id="overlayCloseDuplicates" class="btn">Close Dups</button>
            <button id="overlayGroupByDomain" class="btn">Group by Domain</button>
            <button id="overlayCloseOthers" class="btn">Close Others</button>
          </div>
        </nav>
      </div>

      <section class="content flex-1 p-3">
        <header class="flex items-center mb-3">
          <div class="header-left flex items-center gap-3">
            <img src="icons/logo.svg" alt="Logo" class="app-logo w-10 h-10 rounded-md shadow-sm">
            <h1 class="text-lg font-bold text-gray-900">jwd-browser-tab-manager</h1>
          </div>
        </header>

        <div class="stats flex items-center gap-3 mb-3">
          <div class="stat-item bg-gray-50 rounded-md p-2 min-w-[96px]">
            <div class="stat-label text-xs text-gray-500">Total Tabs</div>
            <div class="stat-value text-xl font-extrabold text-gray-900" id="totalTabs">0</div>
          </div>
          <div class="stat-item bg-gray-50 rounded-md p-2 min-w-[96px]">
            <div class="stat-label text-xs text-gray-500">Duplicate Tabs</div>
            <div class="stat-value text-xl font-extrabold text-gray-900" id="duplicateTabs">0</div>
          </div>
          <div class="stats-right ml-auto flex items-center gap-2">
            <button id="exportListBtn" class="btn btn-outline px-3 py-1 rounded border">📤 Export</button>
            <button id="toggleSideMenuInline" class="btn btn-outline px-3 py-1 rounded" title="Toggle side menu" aria-label="Toggle side menu">⇔</button>
            <button id="toggleFullBtn" class="btn btn-outline px-3 py-1 rounded" title="Open full view" aria-label="Open full view">⛶</button>
            <div class="export-controls flex items-center gap-2">
              <label class="text-sm"><input type="checkbox" id="exportCsv" checked> CSV</label>
              <label class="text-sm"><input type="checkbox" id="exportJson"> JSON</label>
              <div class="export-scope flex gap-2 text-sm items-center">
                <label><input type="radio" name="exportScope" id="exportScopeAll" value="all" checked> All</label>
                <label><input type="radio" name="exportScope" id="exportScopeDuplicates" value="duplicates"> Dups</label>
              </div>
            </div>
          </div>
        </div>

        <div id="tabsList" class="tabs-list"></div>
      </section>
    </div>

    <script src="utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
