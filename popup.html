<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duplicate Tabs Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Duplicate Tabs Manager</h1>
    
    <div class="controls">
      <button id="scanButton" class="btn btn-primary">Scan for Duplicates</button>
      <button id="downloadCsvButton" class="btn btn-success" disabled>Download CSV</button>
    </div>
    
    <div id="status" class="status"></div>
    
    <div id="duplicatesList" class="duplicates-list"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
